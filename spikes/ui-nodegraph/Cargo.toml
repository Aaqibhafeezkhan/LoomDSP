[package]
name = "loom-spike-ui-nodegraph"
description = "P0 UI spike: LoomDSP patch canvas on Iced + iced_nodegraph (ADR-0009)."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Standalone: not part of the main workspace, so its large GUI dependency tree
# does not slow down engine builds and CI.
[workspace]

[dependencies]
iced = { version = "0.14" }
iced_nodegraph = "0.5"
loom-core = { path = "../../crates/loom-core" }
loom-modules = { path = "../../crates/loom-modules" }
loom-patch = { path = "../../crates/loom-patch" }
loom-host-desktop = { path = "../../crates/loom-host-desktop" }
