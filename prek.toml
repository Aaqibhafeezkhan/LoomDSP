# Git hooks for LoomDSP, run by prek (https://prek.j178.dev).
#
# Setup, once per clone:
#   mise install          # installs prek, typos, and cargo-deny (see mise.toml)
#   prek install          # installs the pre-commit and pre-push hooks
#
# Run by hand:
#   prek run              # checks staged files
#   prek run --all-files  # checks everything
#
# Why two stages: checks that take a second or two run on every commit, so
# you hear about problems while the change is fresh. Slower checks (tests,
# dependency licences) run before push. CI runs the same checks and more, so
# these hooks give early feedback; they are not the final gate.

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

# Build output, and third-party agent skills vendored into .agents/, are not
# ours to reformat.
exclude = { glob = ["**/target/**", ".agents/**"] }

# ---------------------------------------------------------------------------
# Fast, built-in file checks (no network, no setup).
# ---------------------------------------------------------------------------

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
# Two trailing spaces are a line break in Markdown, so keep them there.
args = ["--markdown-linebreak-ext=md"]

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-added-large-files"
# Screenshots are fine; audio renders and binaries are not.
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
# Changes reach main through pull requests, so CI always runs first.
id = "no-commit-to-branch"
args = ["--branch", "main"]

# ---------------------------------------------------------------------------
# Rust checks on every commit.
# ---------------------------------------------------------------------------

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
# Formats in place. If it changes anything, the commit stops so you can
# review and stage the result.
entry = "cargo fmt --all"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
# Same lint policy as CI (workspace Cargo.toml), with warnings as errors.
entry = "cargo clippy --workspace --all-targets --quiet -- -D warnings"
language = "system"
files = "(\\.rs|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "typos"
name = "typos (spelling)"
# --force-exclude applies _typos.toml excludes to the files prek passes in.
entry = "typos --force-exclude"
language = "system"
types = ["text"]

# ---------------------------------------------------------------------------
# Slower checks before push.
# ---------------------------------------------------------------------------

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
# Debug build, so the no-allocation test on the audio path is active.
entry = "cargo test --workspace --quiet"
language = "system"
files = "(\\.rs|\\.ron|Cargo\\.toml|Cargo\\.lock)$"
pass_filenames = false
require_serial = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny (licences, advisories)"
entry = "cargo deny check"
language = "system"
files = "(Cargo\\.toml|Cargo\\.lock|deny\\.toml)$"
pass_filenames = false
stages = ["pre-push"]
